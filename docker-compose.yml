services:
  ln2oc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        # GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: ln2oc
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LND_GRPC_HOST=${DOCKER_LND_GRPC_HOST:-host.docker.internal:10001}
      # Set if the host you connect through is not in LND's cert SANs (e.g. "localhost").
      - LND_TLS_SERVER_NAME=${DOCKER_LND_TLS_SERVER_NAME:-}
      - LND_MACAROON_PATH=/lnd/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd/tls.cert
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-regtest}
      - SWAP_FEE_RATE=${SWAP_FEE_RATE:-0.007}
      - MIN_PAYOUT_SAT=${MIN_PAYOUT_SAT:-546}
      - MIN_SWAP_SAT=${MIN_SWAP_SAT:-1000}
      - MAX_SWAP_SAT=${MAX_SWAP_SAT:-1000000}
      - MIN_SAT_PER_VBYTE=${MIN_SAT_PER_VBYTE:-1}
      - DOMAIN=${DOMAIN:-127.0.0.1:8000}
      - EXTERNAL_URL=${EXTERNAL_URL:-http://127.0.0.1:8000}
      # The website is another server (service "web"); GET / only redirects there.
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:8080}
      - DATABASE_URL=sqlite:////data/ln2oc.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ln2oc_data:/data
      - ${LND_MACAROON_PATH:-/home/lucas/.polar/networks/3/volumes/lnd/Kross/data/chain/bitcoin/regtest/admin.macaroon}:/lnd/admin.macaroon:ro
      - ${LND_TLS_CERT_PATH:-/home/lucas/.polar/networks/3/volumes/lnd/Kross/tls.cert}:/lnd/tls.cert:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ln2oc_data:
