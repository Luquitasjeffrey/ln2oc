# Configuración en .env (muestras: .env.dev para regtest/Polar, .env.prod para mainnet).
# COMPOSE_PROJECT_NAME (en .env) separa una instancia de otra en la misma máquina.
#
#   dev:   docker compose up -d --build                (LND = Polar, en el host)
#   prod:  COMPOSE_PROFILES=lnd en .env: suma el servicio "lnd" (neutrino, en el compose)

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  ln2oc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        # GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${API_PUBLISH:-8000}:8000"
    # Todos los parámetros del servicio salen de .env; abajo se pisan los que cambian
    # adentro del contenedor (rutas montadas, DB, host de LND).
    env_file:
      - path: .env
        required: false
    environment:
      - LND_GRPC_HOST=${DOCKER_LND_GRPC_HOST:-host.docker.internal:10001}
      # Set if the host you connect through is not in LND's cert SANs (e.g. "localhost").
      - LND_TLS_SERVER_NAME=${DOCKER_LND_TLS_SERVER_NAME:-}
      - LND_MACAROON_PATH=/lnd/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd/tls.cert
      - DATABASE_URL=sqlite:////data/ln2oc.db
    volumes:
      # Named volume by default; set LN2OC_DATA to a host directory (owned by APP_UID) in prod.
      - ${LN2OC_DATA:-ln2oc_data}:/data
      # LND_MACAROON_PATH / LND_TLS_CERT_PATH in .env are HOST paths. If a file does not
      # exist yet (LND without wallet), the container refuses to start instead of docker
      # creating an empty directory in its place inside LND's data dir.
      - type: bind
        source: ${LND_MACAROON_PATH:-/home/lucas/.polar/networks/3/volumes/lnd/Kross/data/chain/bitcoin/regtest/admin.macaroon}
        target: /lnd/admin.macaroon
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LND_TLS_CERT_PATH:-/home/lucas/.polar/networks/3/volumes/lnd/Kross/tls.cert}
        target: /lnd/tls.cert
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The website: its own server (nginx with static files), separate from the API.
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8000}
        VITE_CONTACT_TELEGRAM: ${CONTACT_TELEGRAM:-LucasJeffreyP2P}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${WEB_PUBLISH:-8080}:8080"

  # LND dedicado al servicio (perfil "lnd": solo en prod). Neutrino, sin blockchain local.
  # gRPC (10009) y P2P (9735) NO se publican en el host: ln2oc llega por la red del compose
  # (lnd:10009) y lncli se usa adentro del contenedor (scripts/lnd/lncli.sh).
  lnd:
    image: lightninglabs/lnd:v0.20.0-beta
    profiles: ["lnd"]
    restart: unless-stopped
    logging: *logging
    # Same uid as ln2oc: the macaroon LND writes (0640) is readable by the service.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["--lnddir=/lnd", "--configfile=/etc/lnd/lnd.conf"]
    volumes:
      # Host directory owned by APP_UID (scripts/lnd/init-dirs.sh creates it).
      - ${LND_DIR:-./data/lnd}:/lnd
      - ${LND_CONF:-./deploy/lnd/mainnet.conf}:/etc/lnd/lnd.conf:ro
    # Let LND close the DB cleanly on stop.
    stop_grace_period: 2m

  # Túnel de Cloudflare (perfil "tunnel"): la única entrada desde afuera. Llega a ln2oc y
  # web por la red del compose; el ruteo por path está en deploy/cloudflared/config.yml.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    # Same uid as the owner of the credentials file (0400).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS:-/nonexistent/cloudflared-credentials.json}
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - ln2oc
      - web

volumes:
  ln2oc_data:
