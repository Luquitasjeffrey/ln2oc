# LND del servicio ln2oc: mainnet, neutrino (sin blockchain local).
# Corre en el servicio "lnd" del docker-compose (perfil "lnd"), con --lnddir=/lnd.
# Nodo DEDICADO a ln2oc y con poca plata: nunca un nodo principal.

[Application Options]
alias=ln2oc
debuglevel=info

# gRPC solo dentro de la red del compose (el puerto no se publica en el host).
# ln2oc se conecta a lnd:10009 y verifica el TLS: el cert tiene que incluir "lnd".
rpclisten=0.0.0.0:10009
tlsextradomain=lnd
tlsautorefresh=true
# ln2oc usa gRPC; REST no hace falta.
norest=true

# P2P: el nodo sale hacia afuera (abrir canales, conectarse a peers); el 9735 no se
# publica en el host, así que nadie entra. Los canales tienen que ser PÚBLICOS: las hold
# invoices salen sin route hints.

# Desbloqueo automático en cada arranque. El archivo lo escribe scripts/lnd/create-wallet.sh
# (o recover-wallet.sh) y tiene que existir antes de arrancar LND. allow-create: sin wallet,
# LND arranca igual y espera a que la crees.
wallet-unlock-password-file=/lnd/wallet_password
wallet-unlock-allow-create=true

[Bitcoin]
bitcoin.mainnet=true
bitcoin.node=neutrino

[neutrino]
# Además de los DNS seeds. btcd de Lightning Labs sirve filtros BIP157.
neutrino.addpeer=btcd-mainnet.lightning.computer
neutrino.addpeer=node.eldamar.icu

[fee]
# Obligatorio en mainnet con neutrino: sin mempool propio, la tasa de minería sale de acá.
# Es lo que devuelve EstimateFee para los payouts: MAX_SAT_PER_VBYTE es la defensa contra
# una estimación absurda.
fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
