server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # Multi-page static site: /docs/usuarios/ -> /docs/usuarios/index.html. No SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # Old paths (before the site/docs split) keep working.
    location = /usuario/         { return 301 /docs/usuarios/; }
    location = /comunidades/     { return 301 /docs/comunidades/; }
    location = /operadores/      { return 301 /docs/operadores/; }
    location = /desarrolladores/ { return 301 /docs/desarrolladores/; }
    location = /flujo/           { return 301 /docs/flujo/; }
    location = /arquitectura/    { return 301 /docs/arquitectura/; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
